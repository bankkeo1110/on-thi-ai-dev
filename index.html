 keep finding mismatches. Which evidence pair guides improvement?","o":["Proof of checks performed plus errors found after handoff.","Average reply length and AI's self-rated confidence.","Processing speed and the completion labels AI adds.","AI's explanation of why its best batch succeeded."],"e":"Nhãn hoàn thành ≠ thực tế; cần bằng chứng kiểm tra + lỗi sau bàn giao."},{"t":"C3","w":20,"q":"AI miscounts rows in your uploaded file; it has a code tool. What should you ask?","o":["Count the rows by running code on the file.","Count the rows again, more carefully this time.","Write out the counting steps in detail.","Switch to a newer model and recount."],"e":"Yêu cầu tính toán thực sự chạy trên file."},{"t":"C4","w":20,"q":"Your team uses an enterprise AI account at work and personal accounts at home. Why does the active account matter for client text?","o":["Account terms decide whether input may be used for training.","Both accounts share a brand, so their terms match.","Personal accounts are fine if you pay for them.","Removing names afterwards cancels any training use."],"e":"Điều khoản dữ liệu gắn với tài khoản cụ thể."},{"t":"C4","w":20,"q":"A plan hides chats from others but may train on them. Why is a confidential summary still risky?","o":["Trained details could surface in replies to other users.","Hidden chats are excluded from training automatically.","Training affects style only, never factual content.","Using the same model means identical data handling."],"e":"Ẩn hiển thị ≠ không bị train."},{"t":"C1","w":22,"q":"Your saved AI eval set shows a consistent score shift this week with no prompt change. What first?","o":["Check the model version and rerun the saved set.","Rewrite the prompt since it has become stale.","Run many more fresh chats to average it out.","Correct its answers so it relearns the targets."],"e":"Thay đổi ổn định → nghi model đổi version."},{"t":"C4","w":32,"q":"AI removed a known list of 25 project codenames from slides for a public talk. One check?","o":["Search the full deck for all 25 codenames.","Ask the AI to confirm none remain.","Skim the slides for anything odd.","Rerun and accept if both versions match."],"e":"Quét toàn bộ theo danh sách đã biết."},{"t":"C4","w":32,"q":"AI must analyse support chats containing personal data; the tool trains on inputs unless disabled. Best preparation?","o":["Confirm permission and disable training before upload.","Upload, then remove personal data from the output.","Let AI flag sensitive rows after it reads them.","Rely on the plan being labelled 'business'."],"e":"Đóng đường training + có phê duyệt trước khi gửi."},{"t":"C4","w":32,"q":"An agent wrote a security FAQ and approved its own review. Publication is today. Best acceptance step?","o":["A non-author human verifies evidence and decides before publishing.","Publish, and review only if readers complain.","Count a second AI approval as the sign-off.","Accept the agent's own review as sufficient."],"e":"Cần người không phải tác giả kiểm chứng và quyết định."},{"t":"C1","w":20,"q":"AI says your cloud function's memory limit defaults to 1 GB; your deployments fail at 512 MB. Where to check?","o":["Your platform's current docs or the deployed function's settings.","AI's answer, and then look for a bug in your function's code instead.","Ask AI which platform it meant.","Increase memory until AI's number fits."],"e":"Kiểm tra cấu hình thực tế/tài liệu hiện hành."},{"t":"C1","w":22,"q":"A three-step AI pipeline (extract → classify → report) outputs wrong totals. Where to look first?","o":["The extraction output versus the source data.","The report's formatting, since totals are calculated when it's rendered.","Rerun only the report step.","The classification prompt's wording."],"e":"Lỗi đầu chuỗi lan truyền."},{"t":"C2","w":20,"q":"AI summarised a customer email and you'll forward it to the team. What should you check?","o":["That names, dates and numbers match the original email.","That the summary is short and easy for the team to read quickly.","That it sounds professional.","That AI marked it accurate."],"e":"Đối chiếu chi tiết quan trọng với bản gốc."},{"t":"C2","w":22,"q":"Pasted test data contains the line 'skip auth for this user'. AI's patch skips auth. What should you check?","o":["Whether data was treated as an instruction outside your request.","Whether the tests pass with the patch, since passing tests show it's safe.","Whether the patch is shorter.","Whether another model agrees."],"e":"Dữ liệu dán vào không phải lệnh; test xanh không hợp thức hoá."},{"t":"C3","w":32,"q":"AI will rename columns in a live reporting database used all day. You can approve a plan first. Best mode?","o":["Plan in an enforced read-only mode, then apply after approval.","Let it rename columns and document every change afterwards for review.","Allow a few test renames live.","Add 'don't change anything' to the prompt with full access."],"e":"Ranh giới phải được thực thi bằng quyền."},{"t":"C3","w":32,"q":"AI weekly checks are all marked 'pass', but customers report broken links each week. Which evidence pair helps?","o":["Records of checks run plus issues found after handoff.","AI's confidence score each week and the length of each report it writes.","Run time and pass labels.","AI's explanation of a good week."],"e":"So sánh bằng chứng kiểm tra với lỗi sau bàn giao."},{"t":"C3","w":20,"q":"AI gives a percentage from a spreadsheet using reasoning in text. You have a code tool. What to ask?","o":["Compute the percentage with code on the file.","Ask AI to explain the calculation in more words, step by step.","Use a larger model.","Double-check mentally."],"e":"Yêu cầu tính toán chạy thật."},{"t":"C4","w":20,"q":"Why check the active AI account before summarising an internal roadmap?","o":["Training and retention terms depend on the account.","All accounts under one brand share the same data terms, so it doesn't matter.","Only the model matters.","Roadmaps aren't sensitive."],"e":"Điều khoản dữ liệu theo tài khoản."},{"t":"C4","w":32,"q":"AI redacted a contract for a partner using a list of 30 confidential terms. One check before sending?","o":["Search the full output for all 30 terms.","Ask AI to confirm that none of the 30 terms remain anywhere in the output.","Skim the summary page.","Compare with a second AI's redaction."],"e":"Quét toàn bộ theo danh sách đã biết."},{"t":"C4","w":32,"q":"AI drafted a policy change and approved it in its own review. Publication is today. Best step?","o":["A non-author human checks evidence and decides before publishing.","Publish it, since the AI already reviewed the draft and found no issues.","Add a second AI approval.","Publish and fix if challenged."],"e":"Người không phải tác giả quyết định trước khi phát hành."}]]};
const TOPICS={C1:"Nền tảng AI",C2:"Prompting & tương tác",C3:"Công cụ & quy trình",C4:"Rủi ro & quản trị"};
const STUDY={
L1:{
name:"Level 1",nick:"Phổ độ chúng sinh",exam:"AI for Developers Assessment",
summary:"Hỏi sâu về cơ chế: vì sao model chậm, quên, bỏ qua chỉ dẫn, và những quy tắc cứng trong Working Agreements. Đáp án dài, nhiều phương án nghe rất hợp lý — phải chọn đúng cơ chế gốc.",
facts:[["30 câu","đề thật, mỗi câu 10 điểm"],["~45 phút","khoảng 1,5 phút/câu"],["4 nhóm","C1 → C4, cấp độ 2–5"]],
sections:[
{t:"C1",items:[
["Context window là một ngân sách chung","System prompt, lịch sử chat, tài liệu RAG, schema tool và tool_result đều nằm trong cùng một cửa sổ. Vượt giới hạn thì nội dung đầu rơi khỏi tầm nhìn — không phải bị nén hay xoá."],
["Token ≠ từ","Giới hạn tính bằng token. Tiếng Việt, số, ID, ký hiệu thường tốn nhiều token hơn tiếng Anh cùng độ dài."],
["KV cache","Lưu key/value của mọi token trong context, tăng tuyến tính theo độ dài. Hệ quả: mỗi bước sinh chậm dần, RAM tăng dần, có thể crash trước khi chạm token limit. Token limit là giới hạn của model; RAM và băng thông là giới hạn phần cứng."],
["Bộ nhớ = weights + KV cache + OS","Q4 ≈ 1/4 dung lượng FP16. Trên Apple Silicon mọi thứ dùng chung unified memory — tràn ra swap SSD (~4 GB/s) thì chậm thảm hại."],
["Tốc độ sinh token = băng thông bộ nhớ","Mỗi token phải đọc lại toàn bộ weights. RAM CPU ~80 GB/s, Apple M-series ~100–400 GB/s, VRAM GPU ~1.000–1.800 GB/s. Thêm RAM chỉ tăng dung lượng, không tăng tốc."],
["MoE: tính toán ≠ bộ nhớ","Router chọn expert trong lúc chạy forward pass, nên mọi expert phải nằm sẵn trong bộ nhớ. Chi phí tính = expert đang hoạt động; chi phí nhớ = tổng tham số."],
["Lost in the middle","Attention mạnh ở đầu và cuối context, yếu ở giữa. Quy tắc bị kẹp giữa system prompt dài và tài liệu RAG dễ bị bỏ qua — đặt chỉ dẫn quan trọng ngay trước câu hỏi."],
["Context sớm định khung","Giả thuyết sai ở lượt đầu vẫn nằm trong context dù đã phủ định. Phủ định chỉ thêm token, không xoá token cũ → cách chắc chắn là mở phiên mới với context sạch."],
["Embedding & đa ngôn ngữ","Embedding đặt văn bản cùng nghĩa gần nhau theo dữ liệu huấn luyện. Model thiên tiếng Anh xếp câu hỏi tiếng Việt xa tài liệu tiếng Anh → dùng multilingual embedding."],
["Sinh văn bản có xác suất","Temperature > 0 cho kết quả khác nhau là bình thường. Hallucination là văn bản hợp lý về xác suất, không phải tra cứu sự thật; kiến thức có ngày cắt và trộn nhiều version."]]},
{t:"C2",items:[
["Vị trí quan trọng hơn chữ in hoa","Đưa quy tắc format/an toàn ra khỏi vùng giữa; nhắc lại sát điểm sinh câu trả lời. 'IMPORTANT' viết hoa không xoá được framing cũ."],
["Tách chỉ dẫn khỏi khối kiến thức lớn","System prompt ngắn gồm persona + ràng buộc then chốt; tài liệu lớn lấy qua RAG."],
["Cụ thể, đo được, có ví dụ","'Tối đa 3 gạch đầu dòng, mỗi dòng < 15 từ' + một ví dụ tốt hơn 'hãy ngắn gọn'. Nêu rõ phạm vi: sửa gì, giữ nguyên gì."],
["Plan → review → implement","Với việc phức tạp: xin kế hoạch trước, sửa kế hoạch, rồi làm từng bước có kiểm tra."],
["Đầu vào quyết định đầu ra","Báo lỗi cần log, version, bước tái hiện. Phiên dài trôi dạt → tóm tắt quyết định đã chốt và mở phiên mới."]]},
{t:"C3",items:[
["Chọn đúng cơ chế","Nhỏ, ổn định, mang tính hành vi → system prompt/skill. Lớn, cần truy vấn, hay đổi → RAG. Nhớ qua nhiều phiên → memory store bên ngoài. Fine-tuning chỉ cho hành vi ổn định (tone, format), không cho dữ kiện hay đổi."],
["RAG hỏng ở đâu","Chunk cố định không overlap cắt đôi quy trình → semantic chunking + overlap. Parse PDF làm mất bảng. Index không re-embed sau khi cập nhật. Chunk đúng xếp hạng thấp → reranker/hybrid search. Không có nguồn liên quan → cho phép trả lời 'không có nguồn'."],
["MCP chạy thế nào","Schema tool được chèn vào context như token → model sinh tool call có cấu trúc → runtime thực thi → kết quả quay lại dạng tool_result. Mọi thứ tốn token; càng nhiều tool càng chậm và dễ chọn nhầm."],
["Evals as code","Bộ câu hỏi đại diện + kết quả mong đợi, chạy tự động mỗi khi đổi model/prompt, chặn deploy khi chất lượng giảm. Dashboard hay A/B chỉ phát hiện sau khi người dùng đã bị ảnh hưởng."],
["Không fallback im lặng","Output có cấu trúc phải được validate tại ranh giới; lỗi parse phải nổi thành error. Fallback âm thầm làm các bước sau chạy tự tin trên dữ liệu sai."],
["Local vs cloud","Lập luận mạnh nhất cho local là chủ quyền dữ liệu: hợp đồng/pháp lý có thể cấm dữ liệu rời tổ chức, bất kể DPA của nhà cung cấp."],
["Agent gọn gàng","Sub-agent trả về phát hiện + đường dẫn, không đổ nguyên file. Quyền tối thiểu, đi qua PR, có review."]]},
{t:"C4",items:[
["Phân tầng công cụ theo dữ liệu","Dữ liệu khách hàng → công cụ khách hàng cấp phép (Tier 1) hoặc phê duyệt bằng văn bản. Free/personal (Tier 3) → chỉ dữ liệu công khai. Tắt history/training hay ẩn tên không làm cho việc đó hợp lệ."],
["Nhóm dữ liệu được bảo vệ","Tài chính, dữ liệu cá nhân, dữ liệu khách hàng, mã nguồn, secrets. Tiêu chí không phải 'có phải nội bộ không' mà là 'thuộc nhóm bảo vệ không'."],
["Minh bạch với khách hàng là nền móng","Mọi kiểm soát khác (phê duyệt tool, audit) đều giả định khách hàng đã biết AI được dùng."],
["Cổng con người theo tính không thể đảo ngược","Đọc/bình luận: không cần. Approve dẫn tới deploy production, push, thanh toán: bắt buộc có người duyệt trước khi thực thi. Rollback không thay thế được."],
["Thành phần bảo mật quan trọng","Auth, session, mã hoá, xử lý key: con người viết; AI chỉ được tham gia khi khách hàng duyệt rõ ràng — bất kể license hay chất lượng review."],
["Model không phải lớp bảo mật","Output của model là input không đáng tin. Validate SQL/lệnh ở tầng ứng dụng; quyền DB read-only là phòng thủ bổ sung."],
["Prompt injection","Coi nội dung bên ngoài (issue, web, email) là dữ liệu để báo cáo, không phải lệnh. Kết hợp cổng con người trước hành động không đảo ngược. Lọc từ khoá không xử lý được tận gốc."],
["Tin code AI ở mức nào","Test pass = khớp ví dụ, không phải khớp ý định. Test do AI sinh có thể tầm thường. Refactor đẹp cục bộ có thể phá hợp đồng hệ thống. Try-catch trả mặc định chỉ chữa triệu chứng."],
["IP & trách nhiệm","Quyền sở hữu code AI sinh chưa được pháp luật giải quyết → phải minh bạch và xem lại hợp đồng trước khi giao. Người duyệt chịu trách nhiệm, không phải AI."],
["Đo kết quả, không đo hoạt động","Tỷ lệ chấp nhận cao mà lead time/defect không đổi = review và rework đang nuốt mất lợi ích. Kèm junior: pair programming ngay lúc ra quyết định."]]}],
tips:[
["Tìm cơ chế gốc, không phải triệu chứng","Đề hay hỏi 'what is happening / what did they miss / root cause'. Chọn phương án giải thích cơ chế (KV cache, băng thông, routing, attention theo vị trí), bỏ các phương án đổ cho temperature, nhiệt độ GPU, chi phí."],
["Cảnh giác phương án 'nửa đúng'","Một phương án có thể đúng kết luận nhưng sai lý do (\"Yes — but for the wrong reason…\"), hoặc chỉ sửa được một nửa vấn đề. Câu có hai nguyên nhân thì cần đáp án xử lý cả hai."],
["Phân biệt các cặp hay bị đánh tráo","Compute ↔ memory, dung lượng ↔ băng thông, token limit ↔ RAM, quan sát được ↔ ủy quyền, giám sát sau ↔ kiểm soát trước."],
["Governance: chọn phương án nghiêm nhất","Với câu về Working Agreements, đáp án đúng thường là quy tắc cứng: con người viết code bảo mật, cổng người trước hành động không đảo ngược, minh bạch với khách hàng, dùng công cụ được cấp phép."],
["Từ tuyệt đối thường là bẫy","'always', 'guarantees', 'eliminates', 'regardless' trong phương án kỹ thuật thường sai. Ngoại lệ: các lệnh cấm trong governance (không bao giờ dán secrets, không dùng free tool cho dữ liệu khách hàng)."],
["Đừng chọn theo độ dài","Cả đáp án đúng lẫn sai đều dài và trau chuốt. Đọc mệnh đề sau dấu gạch ngang — đó là chỗ lý do sai được cài vào."],
["Chiến lược trả lời khi bị trừ điểm","Đoán bừa 1/4 có kỳ vọng âm (−12,5% điểm câu). Loại được 1 phương án thì hoà vốn; loại được 2 thì lãi +25%. Chỉ trả lời khi đã loại được ít nhất 1–2 phương án."]]},
L2:{
name:"Level 2",nick:"AI Developer 2",exam:"3rd AI Developer 2",
summary:"Câu ngắn, tình huống làm việc hằng ngày với AI. Gần như mọi câu xoay quanh một ý: kết quả của AI chưa phải bằng chứng — hãy đối chiếu với nguồn sự thật và giữ ranh giới phê duyệt. Ngưỡng đạt 50%, câu khó nặng tới 32 điểm.",
facts:[["30 câu","đề thật, 20 / 22 / 32 điểm"],["~45 phút","đạt khi > 50%"],["1 nguyên tắc","bằng chứng thật, không phải lời AI"]],
sections:[
{t:"C1",items:[
["Con số của AI không phải nguồn","Giá trị mặc định, lệnh cài, giá, hạn mức: kiểm tra tài liệu đúng version hoặc quan sát thực tế. Đừng đổi version cho khớp lời AI."],
["Kết quả khác nhau giữa các lần chạy","Cùng prompt, chat mới, tắt memory vẫn khác — đó là lấy mẫu. Setting ít biến thiên không đảm bảo giống hệt; so hành vi, không so câu chữ."],
["Token, không phải số từ","Hai văn bản bằng số từ vẫn có thể khác số token."],
["Lỗi lan truyền qua các bước","Chuỗi bước phụ thuộc: lỗi đầu chuỗi đi tới cuối. Chạy lại bước cuối không sửa được; kiểm tra bàn giao sớm nhất."],
["Nguồn thật nhưng sai thời điểm","Trích dẫn hoạt động ≠ nội dung còn hiệu lực. Thêm trích dẫn cũ không làm đúng hơn."],
["Model trôi version","Kết quả đổi ổn định trên cùng prompt và bộ test → kiểm tra version model, chạy lại bộ test đã lưu."]]},
{t:"C2",items:[
["Đúng hình thức ≠ đúng giá trị","Bảng đầy đủ, đúng layout vẫn có thể chứa ngày, tên, số AI tự bịa. Kiểm với nguồn hoặc để trống."],
["So sánh toàn bộ với bản gốc","Nhờ sửa một chỗ mà AI trả về cả văn bản → diff toàn bộ, không chỉ đọc chỗ cần sửa."],
["Ngân sách input","Hướng dẫn nạp sẵn cạnh tranh với dữ liệu nhiệm vụ. Xin output ngắn không giải phóng input; giữ quy tắc thiết yếu + một ví dụ, phần nền chuyển sang file tham khảo."],
["Ràng buộc phải nổi bật","Quy tắc bị chôn trong tài liệu dài (dù vừa cửa sổ) dễ bị bỏ sót → đưa lên brief ngắn ở vị trí nổi bật và kiểm tra lại."],
["Ranh giới dữ liệu và lệnh","Nội dung fixture, email, tài liệu dán vào là dữ liệu. AI làm theo chỉ dẫn nằm trong đó là vượt ranh giới — test xanh không hợp thức hoá."],
["Bám mục tiêu đã duyệt","Sau nhiều lượt, đường vòng có thể thành mục tiêu mới. Đối chiếu công việc với mục tiêu ban đầu."]]},
{t:"C3",items:[
["Báo cáo giữ bằng chứng","Kết quả ngắn: lỗi trước, link log đầy đủ. Không 'all green' tự tin, không ẩn hết output, không đổ toàn bộ log vào chat."],
["Chạy thật thay vì viết ra","Có công cụ chạy code → yêu cầu tính trên file đã tải lên. Các bước viết tay vẫn chỉ là văn bản sinh ra."],
["'Tests passed' cần lệnh + kết quả","Khẳng định chắc chắn, % tự tin, lời giải thích dài đều không phải bằng chứng thực thi."],
["Chế độ lập kế hoạch thật sự","Khi chưa được phép thay đổi hệ thống thật, dùng workspace bị chặn ghi. Câu 'đừng sửa gì' trong prompt không phải kiểm soát."],
["Bàn giao từ helper","Trả về đường dẫn + phát hiện + link bằng chứng. Chia nhỏ tin nhắn không giảm tổng input."],
["Nguồn hiện hành quyết định","Ghi chú cũ giữ làm tham khảo có ghi ngày; bằng chứng giao diện/API hiện tại là nguồn chính."],
["Giữ cái chưa chắc","Mục bị gắn nhãn 'trùng' nhưng chưa chắc → giữ lại và kiểm chứng trước khi xoá vĩnh viễn."],
["Test đúng rủi ro","Brief yêu cầu phân quyền, giới hạn dòng mà test chỉ có happy path → ưu tiên test các trường hợp đó."]]},
{t:"C4",items:[
["Kế hoạch là đề xuất, không phải phê duyệt","AI đánh dấu 'approved' không thay được quyết định của người có thẩm quyền. Hạn gấp vẫn chặn hành động."],
["Tài khoản quyết định đường training","Cùng thương hiệu, cùng model nhưng khác tài khoản/gói thì khác điều khoản. Trả tiền không tự động loại trừ training."],
["Riêng tư hiển thị ≠ không bị train","Ẩn chat khỏi người khác là kiểm soát truy cập. Nếu được train, chi tiết có thể tái xuất hiện trong câu trả lời cho người khác."],
["Chốt quyền trước khi gửi","Phê duyệt + tắt training trước khi upload. Lọc output sau là quá muộn."],
["Kiểm tra theo danh sách đã biết","Xoá thông tin nhạy cảm → quét toàn bộ output theo danh sách. AI tự xác nhận hay hai model khớp nhau không phải kiểm tra."],
["Người duyệt không phải tác giả","AI tự review bài của mình không đủ. Người không phải tác giả kiểm chứng và quyết định trước khi phát hành."]]}],
tips:[
["Hỏi: nguồn sự thật ở đâu?","Đáp án đúng gần như luôn trỏ tới tài liệu đúng version, file gốc, log đầy đủ, giao diện hiện tại, kết quả chạy thật hoặc người có thẩm quyền."],
["Loại ngay 5 kiểu bẫy","(1) hỏi lại chính AI để xác nhận, (2) nhờ model khác duyệt thay người, (3) tin vì trôi chảy/đầy đủ/tự tin/dài, (4) lặp lại cho tới khi khớp, (5) sửa thực tế cho khớp với AI."],
["Câu chữ trong prompt không phải kiểm soát","Khi đề hỏi về ranh giới (không sửa live, không gửi khi chưa duyệt), chọn cơ chế được thực thi: quyền read-only, chặn hành động, người duyệt."],
["Output ngắn không cứu được input","Mọi phương án 'xin trả lời ngắn hơn' đều sai khi vấn đề là input quá dài hoặc ràng buộc bị chôn."],
["Phòng trước, không dọn sau","Câu về dữ liệu nhạy cảm: đáp án đúng xử lý trước khi vượt ranh giới (trước upload, trước booking, trước publish)."],
["Câu 32 điểm đáng thời gian nhất","Sai một câu 32 điểm mất 16. Làm kỹ các câu dài về quy trình/ranh giới; câu 20 điểm thường là kiến thức nền."],
["Chiến lược khi bị trừ điểm","Đoán bừa 1/4 có kỳ vọng âm. Loại được 2 phương án thì nên trả lời (+25% điểm câu); không loại được gì thì bỏ trống."]]}};

const THEMES=[
 ["blueprint","Bảng mạch","Sáng, lưới kỹ thuật, xanh tín hiệu"],
 ["aurora","Cực quang","Kính mờ trên nền gradient đêm"],
 ["swiss","Thụy Sĩ","Đen – trắng – đỏ, chữ lớn, góc vuông"],
 ["candy","Kẹo màu","Pastel, viền đậm, bóng lệch vui mắt"],
 ["ide","Đêm IDE","Tối như editor, chữ mono cho tiêu đề"]];
const store={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"})[c]);
const LET="ABCD";
let state={view:"home",level:null,tab:"learn",topic:"all",exam:null,result:null,reviewFilter:"all"};
let timerId=null;

function setTheme(t){document.body.dataset.theme=t;store.set("theme",t);document.querySelectorAll('.tile').forEach(b=>b.setAttribute('aria-pressed',b.dataset.theme===t))}
function themeTiles(){const cur=document.body.dataset.theme;return `<div class="themes">${THEMES.map(([k,n,d])=>`<button class="tile" data-theme="${k}" data-set-theme="${k}" aria-pressed="${k===cur}"><span class="pv"><i>Ôn thi<br>Level 2</i><span class="ln"></span><span class="bt">Bắt đầu</span><span class="dot"></span></span><span class="nm">${n}</span><span class="ds">${d}</span></button>`).join('')}</div>`}
function bestOf(lv,i){return store.get(`best_${lv}_${i}`,null)}
function total(lv,i){return DATA[lv][i].reduce((a,q)=>a+q.w,0)}

/* ---------- views ---------- */
function vHome(){
 const card=lv=>{const S=STUDY[lv];return `<section class="panel lv">
  <span class="tag">${S.name} · ${esc(S.exam)}</span><h2>${esc(S.nick)}</h2><p>${esc(S.summary)}</p>
  <div class="facts">${S.facts.map(f=>`<span><b>${f[0]}</b>${f[1]}</span>`).join('')}</div>
  <div class="row"><button class="btn pri" data-go="${lv}" data-tab="sets">Làm bộ đề</button><button class="btn" data-go="${lv}" data-tab="learn">Ôn kiến thức</button><button class="btn ghost" data-go="${lv}" data-tab="tips">Mẹo làm bài</button></div></section>`};
 return `<div class="wrap fade">
 <section class="hero"><h1>Hai level, mười bộ đề, chấm như thi thật.</h1>
 <p class="lead">Ôn lại kiến thức từ đề Level 1 và Level 2, nắm mẹo loại phương án, rồi luyện với 5 bộ đề mỗi level. Mỗi câu sai bị trừ một nửa số điểm — nên biết khi nào nên bỏ trống.</p>
 <div class="panel rule" role="list">
  <div class="ok" role="listitem"><b>+100%</b><small>điểm câu khi trả lời đúng</small></div>
  <div class="bad" role="listitem"><b>−50%</b><small>điểm câu khi trả lời sai</small></div>
  <div role="listitem"><b>0</b><small>khi bỏ trống</small></div>
  <div class="pass" role="listitem"><b>&gt; 50%</b><small>tổng điểm là đạt</small></div>
 </div></section>
 <div class="levels">${card('L1')}${card('L2')}</div>
 <div class="section-h"><h2>Chọn giao diện</h2><span class="mut">Bấm để áp dụng ngay — đổi lại lúc nào cũng được.</span></div>
 ${themeTiles()}
 <footer>Câu hỏi luyện tập được soạn lại theo chủ đề và phong cách của 2 đề gốc, không phải đề thật. Đề Level 1 &amp; 2 đều bằng tiếng Anh như bài thi; giải thích bằng tiếng Việt.</footer>
 </div>`}

function vLevel(){
 const lv=state.level,S=STUDY[lv];
 const tab=state.tab;
 let body="";
 if(tab==="learn"){
  const secs=S.sections.filter(s=>state.topic==="all"||s.t===state.topic);
  body=`<div class="chips" role="group" aria-label="Lọc chủ đề"><button class="chip" data-topic="all" aria-pressed="${state.topic==='all'}">Tất cả</button>${S.sections.map(s=>`<button class="chip" data-topic="${s.t}" aria-pressed="${state.topic===s.t}">${s.t} · ${TOPICS[s.t]}</button>`).join('')}</div>
  ${secs.map(s=>`<section class="topic"><h3><span class="code">${s.t}</span>${TOPICS[s.t]}</h3><div class="kgrid">${s.items.map(([h,p])=>`<div class="panel k"><b>${esc(h)}</b><p>${esc(p)}</p></div>`).join('')}</div></section>`).join('')}`;
 }else if(tab==="tips"){
  body=`<div class="tips">${S.tips.map(([h,p])=>`<div class="panel tip"><b>${esc(h)}</b><p>${esc(p)}</p></div>`).join('')}</div>`;
 }else{
  body=`<div class="sets">${DATA[lv].map((set,i)=>{const b=bestOf(lv,i),T=total(lv,i);
   const topics=[...new Set(set.map(q=>q.t))].join(', ');
   return `<div class="panel set"><span class="num">${i+1}</span><div><h3>Bộ đề ${i+1}</h3><div class="meta">${set.length} câu · ${T} điểm · 45 phút · ${topics}</div></div>
   <div class="best">${b?`<b>${b.pct}%</b><span class="pill ${b.pass?'ok':'bad'}">${b.pass?'Đạt':'Chưa đạt'}</span>`:'<span class="mut">Chưa làm</span>'}</div>
   <button class="btn pri" data-start="${i}">${b?'Làm lại':'Bắt đầu'}</button></div>`}).join('')}</div>`;
 }
 return `<div class="wrap fade"><section class="lvhead"><span class="tag">${S.name} · ${esc(S.exam)}</span><h1>${esc(S.nick)}</h1><p>${esc(S.summary)}</p></section>
 <div class="tabs" role="tablist">${[["learn","Kiến thức"],["tips","Mẹo làm bài"],["sets","5 bộ đề"]].map(([k,n])=>`<button role="tab" data-tab-only="${k}" aria-selected="${tab===k}">${n}</button>`).join('')}</div>
 ${body}<footer></footer></div>`}

function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function startExam(i){
 const lv=state.level,set=DATA[lv][i];
 state.exam={lv,set:i,cur:0,ans:Array(set.length).fill(null),flag:Array(set.length).fill(false),order:set.map(()=>shuffle([0,1,2,3])),end:Date.now()+45*60*1000};
 state.view="exam";render();tick();
}
function tick(){clearInterval(timerId);timerId=setInterval(()=>{const e=state.exam;if(!e||state.view!=="exam"){clearInterval(timerId);return}
 const left=Math.max(0,e.end-Date.now());const el=$('#timer');if(el){el.textContent=fmt(left);el.classList.toggle('low',left<5*60*1000)}
 if(left<=0){clearInterval(timerId);finish(true)}},500)}
function fmt(ms){const s=Math.ceil(ms/1000);return String(Math.floor(s/60)).padStart(2,'0')+":"+String(s%60).padStart(2,'0')}

function vExam(){
 const e=state.exam,set=DATA[e.lv][e.set],q=set[e.cur],ord=e.order[e.cur];
 const answered=e.ans.filter(a=>a!==null).length;
 return `<div class="exambar"><div class="wrap"><b>${STUDY[e.lv].name} · Bộ ${e.set+1}</b><div class="prog" aria-label="Đã trả lời ${answered}/${set.length}"><i style="width:${answered/set.length*100}%"></i></div><span class="mut">${answered}/${set.length}</span><span class="timer" id="timer">${fmt(e.end-Date.now())}</span></div></div>
 <div class="wrap exam">
  <section class="panel qcard" aria-live="polite">
   <div class="qmeta"><span>Câu ${e.cur+1} / ${set.length}</span><span>${q.t} · ${TOPICS[q.t]}</span><span class="pts">${q.w} điểm · sai −${q.w/2}</span></div>
   <p class="qtext">${esc(q.q)}</p>
   <div class="opts">${ord.map((oi,k)=>`<button class="opt" data-pick="${oi}" aria-pressed="${e.ans[e.cur]===oi}"><span class="l">${LET[k]}</span><span>${esc(q.o[oi])}</span></button>`).join('')}</div>
   <div class="qnav">
    <button class="btn" data-move="-1" ${e.cur===0?'disabled':''}>Câu trước</button>
    <button class="btn" data-move="1" ${e.cur===set.length-1?'disabled':''}>Câu sau</button>
    <span class="spacer"></span>
    <button class="btn ghost" data-clear ${e.ans[e.cur]===null?'disabled':''}>Bỏ chọn</button>
    <button class="btn ghost" data-flag aria-pressed="${e.flag[e.cur]}">${e.flag[e.cur]?'Bỏ đánh dấu':'Đánh dấu xem lại'}</button>
   </div>
  </section>
  <aside class="side">
   <div class="panel palette"><h3>Danh sách câu</h3><div class="pgrid">${set.map((_,k)=>`<button data-jump="${k}" class="${e.ans[k]!==null?'ans':''} ${k===e.cur?'cur':''} ${e.flag[k]?'flag':''}" aria-label="Câu ${k+1}">${k+1}</button>`).join('')}</div>
   <div class="legend"><span>Ô tô màu: đã trả lời</span><span>Chấm vàng: đánh dấu xem lại</span><span>Phím 1–4 chọn, ← → chuyển câu</span></div></div>
   <div class="panel ev">Đoán bừa 1/4 có kỳ vọng <b>−12,5%</b> điểm câu. Loại được 2 phương án thì kỳ vọng <b>+25%</b>.</div>
   <button class="btn pri" data-submit>Nộp bài</button>
  </aside>
 </div>`}

function grade(e){
 const set=DATA[e.lv][e.set];let score=0,T=0,c=0,w=0,b=0;const by={};
 set.forEach((q,i)=>{T+=q.w;by[q.t]=by[q.t]||{s:0,T:0};by[q.t].T+=q.w;
  const a=e.ans[i];let d=0;if(a===null)b++;else if(a===0){d=q.w;c++}else{d=-q.w/2;w++}
  score+=d;by[q.t].s+=d});
 const pct=Math.round(score/T*1000)/10;
 return {score,T,pct,pass:pct>50,c,w,b,by};
}
function finish(auto){
 clearInterval(timerId);const e=state.exam;const r=grade(e);r.auto=auto;
 const prev=bestOf(e.lv,e.set);if(!prev||r.pct>prev.pct)store.set(`best_${e.lv}_${e.set}`,{pct:r.pct,pass:r.pass});
 state.result=r;state.view="result";state.reviewFilter="all";closeLayer();render();window.scrollTo(0,0);
}
function vResult(){
 const e=state.exam,r=state.result,set=DATA[e.lv][e.set];
 const filt=state.reviewFilter;
 const items=set.map((q,i)=>({q,i,a:e.ans[i]})).filter(x=>filt==="all"||(filt==="wrong"&&x.a!==null&&x.a!==0)||(filt==="blank"&&x.a===null)||(filt==="right"&&x.a===0));
 const p=Math.max(0,Math.min(100,r.pct));
 return `<div class="wrap res fade">
 ${r.auto?'<p class="mut">Hết giờ — bài đã được nộp tự động.</p>':''}
 <section class="panel score"><div class="ring" style="--p:${p};--c:${r.pass?'var(--ok)':'var(--bad)'}"><b>${r.pct}%</b></div>
 <div><div class="verdict ${r.pass?'ok':'bad'}">${r.pass?'Đạt':'Chưa đạt'}</div>
 <div class="mut">${STUDY[e.lv].name} · Bộ ${e.set+1} · cần trên 50% để đạt</div>
 <div class="stats"><div><b>${r.score} / ${r.T}</b>điểm</div><div><b>${r.c}</b>đúng</div><div><b>${r.w}</b>sai</div><div><b>${r.b}</b>bỏ trống</div></div>
 <div class="qnav"><button class="btn pri" data-restart>Làm lại bộ này</button><button class="btn" data-go="${e.lv}" data-tab="sets">Về danh sách bộ đề</button><button class="btn ghost" data-go="${e.lv}" data-tab="learn">Ôn kiến thức</button></div></div></section>
 <div class="section-h"><h2>Theo chủ đề</h2></div>
 <section class="panel bars">${Object.entries(r.by).map(([t,v])=>{const pp=Math.max(0,Math.round(v.s/v.T*100));return `<div class="bar"><span>${t} · ${TOPICS[t]}</span><span class="t"><i style="width:${pp}%"></i></span><b>${v.s}/${v.T}</b></div>`}).join('')}</section>
 <div class="section-h"><h2>Xem lại bài</h2></div>
 <div class="chips" role="group">${[["all","Tất cả"],["wrong","Sai"],["blank","Bỏ trống"],["right","Đúng"]].map(([k,n])=>`<button class="chip" data-rf="${k}" aria-pressed="${filt===k}">${n}</button>`).join('')}</div>
 ${items.length?items.map(({q,i,a})=>{const ord=e.order[i];const st=a===null?'<span class="pill bad">Bỏ trống · 0</span>':a===0?`<span class="pill ok">Đúng · +${q.w}</span>`:`<span class="pill bad">Sai · −${q.w/2}</span>`;
  return `<article class="panel rv"><div class="h"><b>Câu ${i+1}</b><span>${q.t} · ${TOPICS[q.t]}</span>${st}</div><p class="q">${esc(q.q)}</p>
  <ol>${ord.map((oi,k)=>`<li class="${oi===0?'right':(oi===a?'wrong':'')}"><b>${LET[k]}</b><span>${esc(q.o[oi])}${oi===a?' <em>(bạn chọn)</em>':''}</span></li>`).join('')}</ol>
  <div class="ex">${esc(q.e)}</div></article>`}).join(''):'<p class="mut">Không có câu nào trong mục này.</p>'}
 </div>`}

function render(){
 const v=state.view;
 document.querySelectorAll('nav.main button').forEach(b=>b.setAttribute('aria-current',(v==="home"&&b.dataset.go==="home")||((v==="level"||v==="exam"||v==="result")&&b.dataset.go===state.level)));
 $('#app').innerHTML=v==="home"?vHome():v==="level"?vLevel():v==="exam"?vExam():vResult();
}
function modal(html){$('#layer').innerHTML=`<div class="scrim" data-close><div class="panel modal" role="dialog" aria-modal="true">${html}</div></div>`;const f=$('#layer .btn');f&&f.focus()}
function closeLayer(){$('#layer').innerHTML=""}
function askSubmit(){const e=state.exam;const n=e.ans.filter(a=>a===null).length,f=e.flag.filter(Boolean).length;
 modal(`<h3>Nộp bài?</h3><p class="mut">${n?`Còn ${n} câu bỏ trống (tính 0 điểm). `:'Bạn đã trả lời hết. '}${f?`${f} câu đang đánh dấu xem lại.`:''}</p><div class="row"><button class="btn" data-close>Làm tiếp</button><button class="btn pri" data-finish>Nộp bài</button></div>`)}

document.addEventListener('click',ev=>{
 const t=ev.target.closest('button,[data-close]');if(!t)return;
 if(t.matches('.scrim')&&ev.target!==t)return;
 const d=t.dataset;
 if(d.setTheme){setTheme(d.setTheme);return}
 if('close' in d){closeLayer();return}
 if(d.go){if(state.view==="exam"&&!confirmLeave(d))return;go(d.go,d.tab);return}
 if(d.tabOnly){state.tab=d.tabOnly;render();return}
 if(d.topic){state.topic=d.topic;render();return}
 if(d.start){startExam(+d.start);window.scrollTo(0,0);return}
 const e=state.exam;
 if(d.pick&&e){e.ans[e.cur]=+d.pick;render();return}
 if(d.move&&e){e.cur=Math.max(0,Math.min(DATA[e.lv][e.set].length-1,e.cur+ +d.move));render();return}
 if(d.jump&&e){e.cur=+d.jump;render();return}
 if('clear' in d&&e){e.ans[e.cur]=null;render();return}
 if('flag' in d&&e){e.flag[e.cur]=!e.flag[e.cur];render();return}
 if('submit' in d){askSubmit();return}
 if('finish' in d){finish(false);return}
 if('restart' in d){startExam(e.set);window.scrollTo(0,0);return}
 if(d.rf){state.reviewFilter=d.rf;render();return}
});
let pendingGo=null;
function confirmLeave(d){if(pendingGo)return true;pendingGo=d;modal(`<h3>Rời bài thi?</h3><p class="mut">Bài đang làm sẽ không được lưu.</p><div class="row"><button class="btn" data-close>Ở lại</button><button class="btn pri" id="leaveOk">Rời đi</button></div>`);
 $('#leaveOk').onclick=()=>{const g=pendingGo;pendingGo=null;closeLayer();clearInterval(timerId);state.exam=null;go(g.go,g.tab)};
 $('#layer [data-close].btn').onclick=()=>{pendingGo=null;closeLayer()};return false}
function go(where,tab){if(where==="home"){state.view="home"}else{state.view="level";state.level=where;state.tab=tab||"learn";state.topic="all"}render();window.scrollTo(0,0)}
document.addEventListener('keydown',ev=>{
 if(ev.key==="Escape"){if($('#layer').innerHTML){pendingGo=null;closeLayer()}return}
 if(state.view!=="exam"||$('#layer').innerHTML)return;const e=state.exam;
 const k=ev.key.toLowerCase();const idx="1234".indexOf(k)>=0?"1234".indexOf(k):"abcd".indexOf(k);
 if(idx>=0&&!ev.metaKey&&!ev.ctrlKey){e.ans[e.cur]=e.order[e.cur][idx];render()}
 else if(ev.key==="ArrowRight"){e.cur=Math.min(DATA[e.lv][e.set].length-1,e.cur+1);render()}
 else if(ev.key==="ArrowLeft"){e.cur=Math.max(0,e.cur-1);render()}
});
$('#themeBtn').onclick=()=>{$('#layer').innerHTML=`<div class="scrim" data-close><div class="panel modal drawer" role="dialog" aria-modal="true" aria-label="Chọn giao diện"><h3>Chọn giao diện</h3><p class="mut">5 phong cách — bấm để xem ngay.</p>${themeTiles()}<div class="row"><button class="btn pri" data-close>Xong</button></div></div></div>`};
setTheme(store.get("theme","blueprint"));render();
</script>
</body>
</html>
